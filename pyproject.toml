[project]
name = "sop-orchestrator"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.3",
    "reportlab>=5.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Read by both Pyright and basedpyright (the editor). basedpyright rejects a file with both sections.
[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
